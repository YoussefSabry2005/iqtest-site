# Lives in the PUBLIC site repo: unlimited free Actions minutes, and daily
# deploys keep the repo active so GitHub never disables the schedule.
name: uptime
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions: { issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.SITE_URL }}
      EXTRA_HEALTH_URLS: ${{ vars.EXTRA_HEALTH_URLS }}
    steps:
      - name: Check endpoints (3 attempts each)
        id: check
        run: |
          set +e  # a slow attempt must not abort the retries
          fail=""
          for u in "$SITE_URL/" "$SITE_URL/test/" "$SITE_URL/data/bank.json" $EXTRA_HEALTH_URLS; do
            ok=0; for i in 1 2 3; do code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 30 "$u" || true); [ "$code" = "200" ] && { case "$u" in *health*) grep -q '"ok":true' /tmp/b && ok=1;; *) ok=1;; esac; }; [ $ok = 1 ] && break; sleep 20; done
            [ $ok = 1 ] || fail="$fail $u(HTTP $code)"
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ -z "$fail" ] || exit 1
      - name: Open/update outage issue (emailed to the owner)
        if: failure() && vars.NOTIFY_ISSUES == 'on'
        env: { FAILED: "${{ steps.check.outputs.fail }}" }
        run: |
          gh label create outage --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --label outage --title "🚨 Site check failing" --body "Failing: $FAILED at $(date -u)";
          else gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u): $FAILED"; fi
      - name: Close outage issues on recovery
        if: success()
        run: for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number -q '.[].number'); do gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Recovered at $(date -u)."; done
